<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      width: 200px;
      padding: 16px;
      color: #333;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    button {
      display: block;
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      background: #e52e71;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #d2406c;
    }
  </style>
</head>
<body>
  <h1>Inferno</h1>
  <button id="open-instructor">Open Instructor Dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
